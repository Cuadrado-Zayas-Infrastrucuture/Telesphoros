name: staging-frontend
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: staging-frontend
  cancel-in-progress: false
# Two jobs, so third-party install and build code never runs where an AWS-assumable OIDC token can be requested: `build` installs, builds and
# packs the bundle with no id-token permission; `publish` holds id-token, runs no package manager, and uploads only the archive whose digest
# `build` reported. Infrastructure identifiers come from repository variables, never from this file (the repository is public; see PR #86).
jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.STAGING_FRONTEND_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      digest: ${{ steps.pack.outputs.digest }}
    env:
      WEB_BUCKET: ${{ vars.STAGING_FRONTEND_WEB_BUCKET }}
      VITE_OIDC_AUTHORITY: https://cognito-idp.us-east-2.amazonaws.com/us-east-2_CIf0CQGWC
      VITE_OIDC_CLIENT_ID: 2mjjkupobec9r73fsu95h9ps5s
      VITE_COGNITO_DOMAIN: https://telesphoros-staging.auth.us-east-2.amazoncognito.com
      VITE_API_BASE_URL: https://api.staging.telesphoros.app
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
      - id: gate
        name: Only publish successful CI for current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/ci/staging-release.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.gate.outputs.publish == 'true'
      - name: Build and validate upload set without AWS credentials
        if: steps.gate.outputs.publish == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @telesphoros/shared-types build
          bash scripts/staging/publish-frontend.sh
          node -e 'require("fs").writeFileSync("apps/frontend/dist/release.json", JSON.stringify({commit:process.env.RELEASE_SHA}) + "\n")'
      - id: pack
        name: Pack the bundle and record its digest
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          tar -C apps/frontend -cf "$RUNNER_TEMP/frontend-dist.tar" dist
          echo "digest=$(sha256sum "$RUNNER_TEMP/frontend-dist.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gate.outputs.publish == 'true'
        with:
          name: staging-frontend-dist
          path: ${{ runner.temp }}/frontend-dist.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging-frontend
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      AWS_EXPECTED_ACCOUNT: ${{ vars.STAGING_FRONTEND_ACCOUNT_ID }}
      WEB_BUCKET: ${{ vars.STAGING_FRONTEND_WEB_BUCKET }}
      WEB_DISTRIBUTION_ID: ${{ vars.STAGING_FRONTEND_DISTRIBUTION_ID }}
      VITE_OIDC_AUTHORITY: https://cognito-idp.us-east-2.amazonaws.com/us-east-2_CIf0CQGWC
      VITE_OIDC_CLIENT_ID: 2mjjkupobec9r73fsu95h9ps5s
      VITE_COGNITO_DOMAIN: https://telesphoros-staging.auth.us-east-2.amazoncognito.com
      VITE_API_BASE_URL: https://api.staging.telesphoros.app
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      DIST_DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: The deployment variables are set
        run: |
          set -euo pipefail
          [[ "$AWS_EXPECTED_ACCOUNT" =~ ^[0-9]{12}$ ]] || { echo "STAGING_FRONTEND_ACCOUNT_ID is not an account id" >&2; exit 1; }
          [[ "$WEB_DISTRIBUTION_ID" =~ ^E[A-Z0-9]{8,20}$ ]] || { echo "STAGING_FRONTEND_DISTRIBUTION_ID is not a distribution id" >&2; exit 1; }
          [[ "$DIST_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "build reported no bundle digest" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging-frontend-dist
          path: ${{ runner.temp }}/bundle
      - name: The downloaded bundle is the one build packed
        run: |
          set -euo pipefail
          test "$(sha256sum "$RUNNER_TEMP/bundle/frontend-dist.tar" | cut -d' ' -f1)" = "$DIST_DIGEST"
          mkdir -p "$RUNNER_TEMP/site"
          tar -C "$RUNNER_TEMP/site" -xf "$RUNNER_TEMP/bundle/frontend-dist.tar"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.STAGING_FRONTEND_ROLE_ARN }}
          aws-region: us-east-2
          allowed-account-ids: ${{ vars.STAGING_FRONTEND_ACCOUNT_ID }}
          role-session-name: staging-frontend-${{ github.run_id }}
      - name: Recheck main, publish and verify the served commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_EXPECTED_ACCOUNT"
          node .github/ci/staging-release.mjs --require-current
          WEB_DISTRIBUTION_ID="" DIST_DIR="$RUNNER_TEMP/site/dist" bash scripts/staging/publish-frontend.sh --yes
          invalidation="$(aws cloudfront create-invalidation --distribution-id "$WEB_DISTRIBUTION_ID" --paths '/*' --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$WEB_DISTRIBUTION_ID" --id "$invalidation"
          curl --fail --silent --show-error --retry 3 "https://app.staging.telesphoros.app/release.json?commit=$RELEASE_SHA" > "$RUNNER_TEMP/release.json"
          node -e 'const r=require(process.env.RUNNER_TEMP+"/release.json"); if(r.commit!==process.env.RELEASE_SHA) throw Error("Served commit differs from release")'
          echo "Published staging frontend: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
