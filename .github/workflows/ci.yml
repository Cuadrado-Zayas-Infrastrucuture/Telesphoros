          retention-days: 7
          if-no-files-found: error
      - name: Retain synthetic application-recovery measurements
        if: always() && steps.deadline.outputs.armed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-recovery-measurements-${{ github.run_attempt }}
          path: apps/backend/test-results/application-recovery-*.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain worker completion evidence
        if: always() && steps.deadline.outputs.armed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-worker-${{ github.run_attempt }}
          path: ${{ runner.temp }}/service-worker
          retention-days: 7
          if-no-files-found: error
      - if: (failure() || cancelled()) && steps.deadline.outputs.armed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-and-storage-logs-${{ github.run_attempt }}
          path: |
            tier*.log
            moto.log
          retention-days: 7
      - name: Require completion within the shared deadline
        run: node .github/ci/service-budget.mjs check

  # The login flow and the pages, for real: a fake identity provider (test only), the built API, the built
  # frontend, driven by a browser at 375 px and 1280 px.
  browser:
    name: browser
    if: ${{ !cancelled() && (needs.changes.outputs.heavy == 'true' || needs.changes.result == 'failure') }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Resolve the installed Playwright browser version
        id: playwright-version
        working-directory: apps/frontend
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const { version } = require('@playwright/test/package.json');
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid Playwright version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      # System libraries are not part of the cache, so they are installed on every run.
      - name: Install the browser
        working-directory: apps/frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/ci/requirements.txt
      - name: Install the pinned browser S3 emulator
        run: pip install --require-hashes -r .github/ci/requirements.txt
      - run: pnpm test:launcher-cors
      - name: Browser tests
        run: pnpm --filter @telesphoros/frontend e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failures
          path: apps/frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Both roots are mandatory; mocked plans and policy probes use no cloud credentials or apply.
  terraform:
    name: terraform
    if: ${{ !cancelled() && (needs.changes.outputs.terraform == 'true' || needs.changes.result == 'failure') }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Explicit selectors keep both roots independent of a job-default working directory.
      - run: terraform -chdir=infrastructure/terraform fmt -check -recursive -diff
      - run: terraform -chdir=infrastructure/terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infrastructure/terraform validate
      - run: terraform -chdir=infrastructure/terraform test -no-color
      - run: terraform -chdir=infrastructure/terraform-state fmt -check -recursive -diff
      - run: terraform -chdir=infrastructure/terraform-state init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infrastructure/terraform-state validate
      - run: terraform -chdir=infrastructure/terraform-state test -no-color
      - run: node --test infrastructure/terraform-state/guard.test.mjs
      - run: node --test infrastructure/terraform-state/policy.test.mjs
        env:
          FD7A_TEST_EVIDENCE_DIR: ${{ runner.temp }}
      - name: Retain standalone policy producer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fd7a-policy-producer-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fd7a-policy-*/
          retention-days: 7
          if-no-files-found: error

  # Advisory for now (not a required check): tflint's rules have not yet run on this code.
  # Promote it to a required check once it has been clean on main (docs/ops/ci-cd.md).
  terraform-lint:
    name: terraform-lint
    if: ${{ !cancelled() && (needs.changes.outputs.terraform == 'true' || needs.changes.result == 'failure') }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          # Lets tflint download its AWS rule plugin without hitting the anonymous API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  # Every commit in the history, not just the diff: a secret removed in a later commit is still leaked.
  secret-scan:
    name: secret-scan
    # Never decided by the scope: it runs unless the `changes` job was skipped (a draft). If `changes` fails, it runs.
    if: ${{ !cancelled() && needs.changes.result != 'skipped' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3' # an exact release, not "stable": the toolchain that builds gitleaks is a build input
          # This repository has no go.sum. Hash the one-line file that holds the gitleaks version, not the whole workflow: every workflow edit used to
          # discard this cache. setup-go also keys by OS, architecture and Go version. cache.test.mjs keeps the file equal to the install command below.
          cache: true
          cache-dependency-path: .github/ci/gitleaks.version
      # Built from source: the Go module checksum database verifies it. (The module still carries its
      # former path, github.com/zricethezav/gitleaks.) The maintainers' GitHub Action needs a paid licence
      # for organization repositories, so it is deliberately not used.
      - name: Install gitleaks v8.30.1
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan the full history
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --verbose --config .gitleaks.toml

  image:
    name: image
    if: ${{ !cancelled() && (needs.changes.outputs.archive == 'true' || needs.changes.result == 'failure') }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # INF-03 (specs/002-signed-image-release): the one digest the release-image job may push and sign.
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node --test infrastructure/docker/guard.test.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          platforms: linux/amd64
          push: false
          sbom: true
          provenance: mode=max
          outputs: type=oci,dest=${{ runner.temp }}/api.oci.tar
          cache-from: type=gha,scope=api-amd64-v1,timeout=2m
          cache-to: type=gha,scope=api-amd64-v1,mode=max,ignore-error=true,timeout=2m
      - name: Record the image digest
        id: digest
        run: node infrastructure/docker/image-digest.mjs digest "$RUNNER_TEMP/api.oci.tar" >> "$GITHUB_OUTPUT"
      # The release tools (pinned, checksum-verified) load the archive's own image below and rehearse the release later in this job.
      - name: Install the release tools (pinned, checksum-verified)
        run: |
          infrastructure/docker/release-tools.sh "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      # Trivy, the readiness test and the rehearsal run THE ARCHIVE'S linux/amd64 image, the one that is released (INF-03). Classic Docker stores cannot
      # load the attested index, and a second `--load` build was not the same image (its last layers were rebuilt with other bytes, found 2026-10-21), so
      # the image is loaded from the archive itself; the script ends by checking its config digest against the archive.
      - name: Load the archive's image (the one that is released)
        run: infrastructure/docker/load-archive-image.sh "$RUNNER_TEMP/api.oci.tar" telesphoros-fd4b:rehearsal
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: telesphoros-fd4b:rehearsal
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: infrastructure/docker/trivy.ignore
          version: v0.70.0 # the scanner itself, pinned: an action bump must not change it silently
      - run: node --test infrastructure/docker/postgres-readiness.test.cjs
      - run: node infrastructure/docker/rehearsal.cjs telesphoros-fd4b:rehearsal
      # The release-image job's exact commands, against a throwaway local registry and key, with every public endpoint unreachable (INF-03).
      - name: Rehearse the release
        run: infrastructure/docker/release-rehearsal.sh "$RUNNER_TEMP/api.oci.tar" "${{ steps.digest.outputs.digest }}"
      # OCI retains SBOM/provenance that the Docker load exporter can discard.
      # Private repository artifact only; no registry push or transparency log.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-image-with-attestations
          path: ${{ runner.temp }}/api.oci.tar
          retention-days: 1
          if-no-files-found: error

  # INF-03 slice 2 (specs/002-signed-image-release). After a merge to main: push the archive the image job built, scanned and rehearsed to ECR without a
  # rebuild, check that ECR kept its digest, and sign that digest with the KMS image-signing key, writing to no public transparency log. The ONLY job with
  # `id-token: write`, and not a required check (it runs after the merge). Dormant until the founder applies signing.tf, creates the image-release
  # environment (limited to main) and sets the repository variables below from the Terraform outputs.
  release-image:
    name: release-image
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.IMAGE_RELEASE_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: image-release
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.IMAGE_RELEASE_REGION }}
      IMAGE_REPOSITORY_URL: ${{ vars.IMAGE_REPOSITORY_URL }}
      IMAGE_SIGNING_KEY_ALIAS: ${{ vars.IMAGE_SIGNING_KEY_ALIAS }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-image-with-attestations
          path: ${{ runner.temp }}/release
      - name: The downloaded archive is the one the image job scanned
        run: test "$(node infrastructure/docker/image-digest.mjs digest "$RUNNER_TEMP/release/api.oci.tar")" = "digest=$IMAGE_DIGEST"
      - name: Install the release tools (pinned, checksum-verified)
        run: |
          infrastructure/docker/release-tools.sh "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.IMAGE_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.IMAGE_RELEASE_REGION }}
      - name: Push without a rebuild, compare the digest, sign
        run: infrastructure/docker/release-image.sh "$RUNNER_TEMP/release/api.oci.tar"
