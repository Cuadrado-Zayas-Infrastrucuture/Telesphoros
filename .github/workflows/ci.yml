# Continuous integration. See docs/ops/ci-cd.md for what each job proves and how branch protection uses them.
#
# The six external gate names below ARE the required status checks in .github/rulesets/main.json.
# Renaming a job silently un-requires it, so change both together.
#
# Synthetic data only: nothing here has cloud credentials, and nothing is deployed.
name: ci

on:
  # ready_for_review is what runs CI for a draft once it is marked ready: a draft's own runs are skipped (the `changes` job below), so without it a
  # draft's skipped, "successful" checks would be the only ones on the head (guard: scope.test.mjs). The other three are GitHub's defaults.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The complete run, with the standalone PostgreSQL profile that pull requests leave out (docs/ops/ci-cd.md "Nightly"). 07:41 UTC is 03:41 in Puerto Rico,
  # when no merge is likely: it shares the concurrency group of pushes to main, and a queued run is replaced by a newer queued one. Skipped when an
  # earlier nightly already passed everything at the same commit. workflow_dispatch is the same complete run, on demand, on any branch.
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]

# Least privilege: every job only reads the repository. No job needs to write checks, comments or packages.
permissions:
  contents: read

# A newer push to the same pull request supersedes the older run. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  # An EXACT release, never a floating major. The report adapter's unavailable-value matcher is pinned to Unicode 16.0
  # and refuses to load on a runtime with other Unicode data, and a newer Node 22 already reports Unicode 17.0.
  # Moving this is a deliberate change: re-run the matcher's conformance tests, then change the pin in
  # apps/backend/src/services/report-adapter/unavailable-matcher.ts and docs/design/report-adapter-spec.md together.
  NODE_VERSION: "22.22.0"

jobs:
  # Decides what this run must do (.github/ci/scope.mjs; docs/ops/ci-cd.md "Skipping work: what is proved"). It is not a required check: when it fails,
  # every job below runs anyway, so a broken decision costs minutes, never coverage. secret-scan never waits for it.
  changes:
    name: changes
    # The only place a draft is recognised. A draft pull request skips this job, so every job that needs it is skipped too, and secret-scan
    # (which waits only for it to be skipped) as well: no hosted minutes until the pull request is marked ready.
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
      guards: ${{ steps.scope.outputs.guards }}
      terraform: ${{ steps.scope.outputs.terraform }}
      postgres: ${{ steps.scope.outputs.postgres }}
      archive: ${{ steps.scope.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Decide the scope of this run
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENABLED: ${{ vars.IMAGE_RELEASE_ROLE_ARN != '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        # A pull request must not decide its own scope: the decision code is read from the base branch, never from the change under review.
        # The base must be a full commit id: an empty one would make `git show` read the index, which is the change's own copy.
        # If the base copy cannot be read the step fails, `changes` fails, and every job runs.
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            printf '%s\n' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
            git show "$BASE_SHA:.github/ci/scope.mjs" > "$RUNNER_TEMP/scope.mjs"
            node "$RUNNER_TEMP/scope.mjs"
          else
            node .github/ci/scope.mjs
          fi

  # Fast gate: types, lint, the unit/API suites on the in-memory store, the production builds,
  # the knowledge-directory check, and the infrastructure tripwire.
  verify:
    name: verify
    if: ${{ !cancelled() && (needs.changes.outputs.guards == 'true' || needs.changes.result == 'failure') }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Unconditional: test:infra loads the backend's configuration loader (zod), so even a documentation-only run needs the install.
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: ${{ needs.changes.outputs.heavy == 'true' || needs.changes.result == 'failure' }}
        run: pnpm typecheck
      - name: Lint
        if: ${{ needs.changes.outputs.heavy == 'true' || needs.changes.result == 'failure' }}
        run: pnpm lint
      - name: Workspace tests
        if: ${{ needs.changes.outputs.heavy == 'true' || needs.changes.result == 'failure' }}
        run: pnpm test
      - name: Production builds
        if: ${{ needs.changes.outputs.heavy == 'true' || needs.changes.result == 'failure' }}
        run: pnpm build
      - name: Published FHIR Genomics IG validation (synthetic only)
        if: ${{ needs.changes.outputs.heavy == 'true' || needs.changes.result == 'failure' }}
        run: JAVA_HOME="$JAVA_HOME_21_X64" pnpm --filter @telesphoros/smart-pilot test:ig
      - name: Frontend chunk budget
        if: ${{ needs.changes.outputs.heavy == 'true' || needs.changes.result == 'failure' }}
        run: pnpm --filter @telesphoros/frontend check:chunks
      # Fails if anything synthetic or unreviewed sits in the real knowledge directory.
      - name: Knowledge directory loads under production rules
        if: ${{ needs.changes.outputs.heavy == 'true' || needs.changes.result == 'failure' }}
        run: pnpm --filter @telesphoros/backend knowledge:verify --production
      # The two guards below run on every pull request, including documentation-only ones: they are the only code that reads docs/ and CLAUDE.md
      # (scope.test.mjs lists the readers). Everything above is skipped when only documentation changed.
      - name: Terraform security tripwire
        run: pnpm test:infra
      - name: CI configuration tripwire (pinned actions, required checks match the ruleset)
        run: pnpm test:ci-config

  # Complete, unchanged profiles run on separate PostgreSQL clusters and runner filesystems.
  # Every job shares the run-attempt start + 30 minutes; no new job grants a fresh budget.
  service-memory:
    name: service-memory
    if: ${{ !cancelled() && (needs.changes.outputs.heavy == 'true' || needs.changes.result == 'failure') }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d # postgres:16, multi-arch index; one digest for every tier (supply-chain.test.mjs)
        env:
          # A throwaway service container on the runner, reachable only from this job. Not a secret.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SERVICE_WATCHDOG_REQUIRED: "1"
      SERVICE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_S3_ENDPOINT: http://127.0.0.1:5555
    steps:
      - &service_deadline
        name: Arm the shared deadline before action setup
        id: deadline
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          test -d "$RUNNER_TEMP" && test ! -L "$RUNNER_TEMP"
          (set -o noclobber; cat > "$RUNNER_TEMP/service-deadline.mjs") <<'SERVICE_DEADLINE'
          import { spawn, execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { appendFileSync, lstatSync, readFileSync, readdirSync, readlinkSync, renameSync, writeFileSync } from 'node:fs';
          import { basename, isAbsolute, join, resolve } from 'node:path';
          import { fileURLToPath, pathToFileURL } from 'node:url';

          export const budgetMs = 30 * 60_000;
          // Closed list of reason codes. A refusal may name the clause that failed, never a value, path or file content.
          export const reasons = Object.freeze(['watchdog-receipt-invalid', 'watchdog-not-armed', 'watchdog-process-changed', 'watchdog-owner-changed',
            'watchdog-uid-mismatch', 'watchdog-budget-mismatch', 'watchdog-source-mismatch', 'watchdog-heartbeat-invalid',
            'watchdog-heartbeat-future', 'watchdog-heartbeat-stale', 'watchdog-did-not-arm',
            'budget-identity-invalid', 'budget-run-mismatch', 'budget-run-started-invalid', 'budget-invalid', 'budget-not-started', 'budget-expired',
            'budget-request-invalid', 'budget-api-unreachable', 'budget-api-refused', 'budget-api-response-invalid',
            'hosted-environment-unsupported', 'hosted-owner-missing', 'output-path-invalid']);
          const refuse = reason => { throw Object.assign(new Error('Service budget validation failed.'), reasons.includes(reason) ? { reason } : {}); };
          // The watchdog publishes a new heartbeat about every 250 ms; one stamped after the caller sampled `now` is not forged.
          export const heartbeatSkewMs = 1000;
          export function exactKeys(value, names) {
            if (!value || typeof value !== 'object' || Array.isArray(value)
              || JSON.stringify(Object.keys(value).sort()) !== JSON.stringify([...names].sort())) refuse();
          }
          export function identityFromEnv(env) {
            const value = { repository: env.GITHUB_REPOSITORY, runId: env.GITHUB_RUN_ID, attempt: env.GITHUB_RUN_ATTEMPT,
              headSha: env.SERVICE_HEAD_SHA, checkout: env.GITHUB_SHA };
            if (!/^[\w.-]+\/[\w.-]+$/.test(value.repository ?? '')
              || ![value.runId, value.attempt].every(v => /^[1-9]\d*$/.test(v ?? '') && Number.isSafeInteger(Number(v)))
              || ![value.headSha, value.checkout].every(v => /^[a-f0-9]{40}$/.test(v ?? ''))) refuse('budget-identity-invalid');
            return value;
          }
          export function budgetFromRun(run, identity, now = Date.now()) {
            if (String(run.id) !== identity.runId || String(run.run_attempt) !== identity.attempt
              || run.head_sha !== identity.headSha || run.repository?.full_name !== identity.repository) refuse('budget-run-mismatch');
            if (!/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ$/.test(run.run_started_at ?? '')) refuse('budget-run-started-invalid');
            const startedMs = Date.parse(run.run_started_at);
            const budget = { format: 1, ...identity, startedMs, deadlineMs: startedMs + budgetMs };
            remainingMs(budget, now);
            return budget;
          }
          export function remainingMs(budget, now = Date.now()) {
            exactKeys(budget, ['format', 'repository', 'runId', 'attempt', 'headSha', 'checkout', 'startedMs', 'deadlineMs']);
            identityFromEnv({ GITHUB_REPOSITORY: budget.repository, GITHUB_RUN_ID: budget.runId, GITHUB_RUN_ATTEMPT: budget.attempt,
              SERVICE_HEAD_SHA: budget.headSha, GITHUB_SHA: budget.checkout });
            if (budget.format !== 1 || ![budget.startedMs, budget.deadlineMs, now].every(Number.isSafeInteger)
              || budget.deadlineMs - budget.startedMs !== budgetMs) refuse('budget-invalid');
            // An `if: always()` job that starts after the run's budget is spent lands here, 30 minutes after a hung upstream job.
            if (now < budget.startedMs) refuse('budget-not-started');
            if (now >= budget.deadlineMs) refuse('budget-expired');
            return budget.deadlineMs - now;
          }
          export function temporary(env) {
            const directory = env.RUNNER_TEMP;
            if (!directory || !isAbsolute(directory) || !lstatSync(directory).isDirectory()) refuse();
            return directory;
          }
          export function readJson(file) {
            const info = lstatSync(file);
            if (!info.isFile() || info.size > 2 * 1024 * 1024) refuse();
            return JSON.parse(readFileSync(file, 'utf8'));
          }
          export function loadBudget(env = process.env, now = Date.now()) {
            try {
              const budget = readJson(join(temporary(env), 'service-budget.json'));
              const identity = identityFromEnv(env);
              if (Object.entries(identity).some(([key, value]) => budget[key] !== value)) refuse();
              remainingMs(budget, now);
              if (env.SERVICE_WATCHDOG_REQUIRED === '1') validateWatchdog(env, budget, now);
              return budget;
            } catch (error) {
              // The CLI prints one generic line; this names the failed clause from the closed list above and nothing else.
              if (error?.reason) process.stderr.write(`Service budget refused: ${error.reason}.\n`);
              throw error;
            }
          }

          const digest = value => createHash('sha256').update(value).digest('hex');
          export const processKey = p => `${p.pid}:${p.start}`;
          export function parseLinuxProcess(stat, uid) {
            const end = stat.lastIndexOf(')'); const pid = Number(stat.slice(0, stat.indexOf(' ')));
            const fields = stat.slice(end + 2).trim().split(/\s+/);
            if (end < 0 || fields.length < 20 || !Number.isSafeInteger(pid) || pid < 1 || !Number.isSafeInteger(uid) || uid < 0
              || !/^\d+$/.test(fields[1]) || !/^\d+$/.test(fields[19])) refuse();
            if (fields[0] === 'Z') return null;
            return { pid, ppid: Number(fields[1]), uid, start: fields[19], command: stat.slice(stat.indexOf('(') + 1, end) };
          }
          function parseDarwinProcesses(output) {
            const records = [];
            for (const line of output.trim().split('\n')) {
              if (!line.trim()) continue;
              const m = line.trim().match(/^(\d+)\s+(\d+)\s+(\d+)\s+(\S+)\s+(\w+\s+\w+\s+\d+\s+\d\d:\d\d:\d\d\s+\d{4})\s+(.+)$/);
              if (!m) refuse();
              if (!m[4].startsWith('Z')) records.push({ pid: Number(m[1]), ppid: Number(m[2]), uid: Number(m[3]), start: m[5], command: basename(m[6]) });
            }
            return new Map(records.map(p => [p.pid, p]));
          }
          export function readProcess(pid, platform = process.platform, proc = '/proc') {
            if (!Number.isSafeInteger(pid) || pid < 1) refuse();
            try {
              if (platform === 'linux') {
                const directory = join(proc, String(pid));
                const p = parseLinuxProcess(readFileSync(join(directory, 'stat'), 'utf8'), lstatSync(directory).uid);
                if (p && p.uid === process.getuid()) {
                  // Executable inspection has stricter Linux permissions than core identity/signal checks.
                  // Retain cleanup identities when it is unavailable, but never trust mutable comm as an owner.
                  p.command = '';
                  try { p.command = basename(readlinkSync(join(directory, 'exe'))); }
                  catch (error) { if (!['EACCES', 'EPERM', 'ENOENT', 'ESRCH'].includes(error.code)) throw error; }
                }
                return p;
              }
              if (platform === 'darwin') return parseDarwinProcesses(execFileSync('/bin/ps', ['-p', String(pid), '-o', 'pid=,ppid=,uid=,stat=,lstart=,comm='], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] })).get(pid);
              refuse();
            } catch (error) {
              if (error.code === 'ENOENT' || error.code === 'ESRCH' || (platform === 'darwin' && error.status === 1)) return null;
              throw error;
            }
          }
          export function readProcesses(platform = process.platform, proc = '/proc') {
            if (platform === 'darwin') return parseDarwinProcesses(execFileSync('/bin/ps', ['-axo', 'pid=,ppid=,uid=,stat=,lstart=,comm='], { encoding: 'utf8' }));
            if (platform !== 'linux') refuse();
            const records = [];
            for (const name of readdirSync(proc)) {
              if (!/^[1-9]\d*$/.test(name)) continue;
              const p = readProcess(Number(name), platform, proc); if (p) records.push(p);
            }
            return new Map(records.map(p => [p.pid, p]));
          }
          export function selectNewProcesses(table, baseline, uid, excluded = new Set()) {
            return [...table.values()].filter(p => p.uid === uid && !excluded.has(p.pid) && processKey(baseline.get(p.pid) ?? {}) !== processKey(p));
          }
          export function selectDescendants(table, known) {
            const selected = new Map([...known].filter(([pid, p]) => table.get(pid) && processKey(table.get(pid)) === processKey(p)));
            let changed;
            do {
              changed = false;
              for (const p of table.values()) if (!selected.has(p.pid) && selected.has(p.ppid)) { selected.set(p.pid, p); changed = true; }
            } while (changed);
            return [...selected.values()];
          }
          export function signalIdentity(p, signal, { read = readProcess, kill = process.kill } = {}) {
            if (!p || p.pid <= 1 || p.pid === process.pid) return false;
            const current = read(p.pid);
            if (!current || current.uid !== p.uid || processKey(current) !== processKey(p)) return false;
            try { kill(p.pid, signal); return true; }
            catch (error) { if (error.code === 'ESRCH') return false; throw error; }
          }
          const delay = ms => new Promise(r => setTimeout(r, ms));
          /** Freeze the captured descendants before losing ancestry, then give TERM a bounded cleanup grace. */
          export async function terminateProcesses(select, { read = readProcesses, signal = signalIdentity, graceMs = 500 } = {}) {
            const known = new Map();
            const capture = () => { for (const p of select(read())) known.set(p.pid, p); return [...known.values()]; };
            const initial = capture(); if (!initial.length) return;
            for (const p of initial) signal(p, 'SIGSTOP');
            for (const p of capture()) signal(p, 'SIGTERM');
            for (const p of known.values()) signal(p, 'SIGCONT');
            const end = Date.now() + graceMs;
            do {
              await delay(Math.min(25, Math.max(1, end - Date.now())));
              for (const p of capture()) if (!signal(p, 'SIGTERM')) known.delete(p.pid);
            } while (Date.now() < end);
            for (const p of capture()) signal(p, 'SIGKILL');
          }
          export function hostedOwner(env, table = readProcesses(), platform = process.platform, uid = process.getuid?.()) {
            if (platform !== 'linux' || env.RUNNER_ENVIRONMENT !== 'github-hosted' || env.RUNNER_OS !== 'Linux' || env.RUNNER_ARCH !== 'X64' || !uid) refuse('hosted-environment-unsupported');
            let p = table.get(process.pid); const seen = new Set();
            while (p && !seen.has(p.pid)) {
              seen.add(p.pid);
              if (p.command === 'Runner.Worker' && p.uid === uid && p.pid !== process.pid) return p;
              p = table.get(p.ppid);
            }
            refuse('hosted-owner-missing');
          }
          function atomicJson(file, value) {
            const temporaryFile = file + '.' + process.pid;
            writeFileSync(temporaryFile, JSON.stringify(value) + '\n', { mode: 0o600, flag: 'wx' }); renameSync(temporaryFile, file);
          }
          export function validateWatchdog(env, budget, now = Date.now(), read = readProcess) {
            let receipt;
            try {
              receipt = readJson(join(temporary(env), 'service-watchdog.json'));
              exactKeys(receipt, ['format', 'state', 'pid', 'start', 'owner', 'budgetHash', 'sourceHash', 'heartbeatMs']);
              exactKeys(receipt.owner, ['pid', 'ppid', 'uid', 'start', 'command']);
            } catch { refuse('watchdog-receipt-invalid'); }
            const current = read(receipt.pid), owner = read(receipt.owner.pid);
            if (receipt.format !== 1 || receipt.state !== 'armed') refuse('watchdog-not-armed');
            if (!current || current.start !== receipt.start) refuse('watchdog-process-changed');
            if (!owner || processKey(owner) !== processKey(receipt.owner) || owner.command !== 'Runner.Worker') refuse('watchdog-owner-changed');
            if (current.uid !== process.getuid() || owner.uid !== current.uid) refuse('watchdog-uid-mismatch');
            if (receipt.budgetHash !== digest(JSON.stringify(budget))) refuse('watchdog-budget-mismatch');
            if (receipt.sourceHash !== digest(readFileSync(fileURLToPath(import.meta.url)))) refuse('watchdog-source-mismatch');
            if (!Number.isSafeInteger(receipt.heartbeatMs)) refuse('watchdog-heartbeat-invalid');
            if (receipt.heartbeatMs > now + heartbeatSkewMs) refuse('watchdog-heartbeat-future');
            if (now - receipt.heartbeatMs > 5000) refuse('watchdog-heartbeat-stale');
            return receipt;
          }
          /** A dedicated hosted VM makes new same-UID processes attributable even after reparenting/setsid. */
          export async function watchJob({ budget, owner, baseline, uid, directory, read = readProcesses, signal = signalIdentity,
            now = Date.now, sourceHash = digest(readFileSync(fileURLToPath(import.meta.url))), onReady = () => {}, shutdownGraceMs = 5000 }) {
            const self = readProcess(process.pid); if (!self) refuse();
            remainingMs(budget, now());
            const receipt = { format: 1, state: 'armed', pid: process.pid, start: self.start, owner, budgetHash: digest(JSON.stringify(budget)), sourceHash, heartbeatMs: now() };
            const file = join(directory, 'service-watchdog.json');
            const publish = () => { receipt.heartbeatMs = now(); atomicJson(file, receipt); };
            const sameOwner = table => table.get(owner.pid) && processKey(table.get(owner.pid)) === processKey(owner);
            const targets = table => selectNewProcesses(table, baseline, uid, new Set([process.pid, owner.pid]));
            let table = read(); if (!sameOwner(table)) refuse();
            // Supervision errors must retain the same bounded shutdown as expiry, even if receipts cannot be written.
            const shutdown = async () => {
              let failed = false;
              const snapshot = () => { try { table = read(); } catch { failed = true; } return table; };
              const send = (p, kind) => { try { return signal(p, kind); } catch { failed = true; return false; } };
              send(owner, 'SIGTERM');
              try {
                try { await terminateProcesses(targets, { read: snapshot, signal: send }); } catch { failed = true; }
                const end = Date.now() + shutdownGraceMs;
                while (sameOwner(snapshot()) && Date.now() < end) {
                  for (const p of targets(table)) send(p, 'SIGKILL');
                  await delay(25);
                }
              } finally {
                // Always attempt escalation. Cached entries still pass live PID/start/UID checks before a signal.
                if (sameOwner(snapshot())) send(owner, 'SIGKILL');
                for (const p of targets(snapshot())) send(p, 'SIGKILL');
              }
              return !failed;
            };
            publish(); onReady();
            let interrupt = false;
            const stop = () => { interrupt = true; };
            process.on('SIGTERM', stop); process.on('SIGINT', stop);
            try {
              while (sameOwner(table = read())) {
                if (interrupt || now() < budget.startedMs || now() >= budget.deadlineMs) {
                  receipt.state = 'expired'; publish();
                  // Runner.Worker handles SIGTERM by cancelling its linked job token (Worker_Unloading).
                  if (!await shutdown()) {
                    receipt.state = 'failed'; try { publish(); } catch { /* shutdown already attempted */ }
                    return 1;
                  }
                  return 124;
                }
                publish(); await delay(Math.min(250, budget.deadlineMs - now()));
              }
              await terminateProcesses(targets, { read, signal });
              receipt.state = 'stopped'; publish(); return 0;
            } catch {
              receipt.state = 'failed'; try { publish(); } catch { /* failure still cancels the job */ }
              await shutdown(); return 1;
            } finally { process.removeListener('SIGTERM', stop); process.removeListener('SIGINT', stop); }
          }
          export async function requestBudget(env = process.env, request = fetch, now = Date.now) {
            const identity = identityFromEnv(env);
            if (!env.GH_TOKEN || env.GITHUB_API_URL !== 'https://api.github.com') refuse('budget-request-invalid');
            let response;
            try {
              response = await request(`${env.GITHUB_API_URL}/repos/${identity.repository}/actions/runs/${identity.runId}/attempts/${identity.attempt}`, {
                headers: { Authorization: `Bearer ${env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10' },
                redirect: 'error', signal: AbortSignal.timeout(10_000),
              });
            } catch { refuse('budget-api-unreachable'); }
            if (!response.ok) refuse('budget-api-refused');
            let run;
            try { run = await response.json(); } catch { refuse('budget-api-response-invalid'); }
            return budgetFromRun(run, identity, now());
          }
          export async function bootstrap(env = process.env, request = fetch, now = Date.now, findOwner = hostedOwner) {
            // Never run machine-wide cleanup on a workstation, self-hosted runner or shared container runner.
            if (!isAbsolute(env.GITHUB_OUTPUT ?? '')) refuse('output-path-invalid');
            const baseline = readProcesses(); const owner = findOwner(env, baseline);
            const budget = await requestBudget(env, request, now);
            const directory = temporary(env);
            writeFileSync(join(directory, 'service-budget.json'), JSON.stringify(budget) + '\n', { mode: 0o600, flag: 'wx' });
            const self = fileURLToPath(import.meta.url);
            const ticket = join(directory, 'service-watchdog-ticket.json');
            writeFileSync(ticket, JSON.stringify({ budget, owner, baseline: [...baseline], uid: process.getuid() }) + '\n', { mode: 0o600, flag: 'wx' });
            // No token/caller environment or runner tracking marker. It must survive orphan cleanup until the owner exits.
            const child = spawn(process.execPath, [self, 'watch'], { detached: true, stdio: ['ignore', 'ignore', 'ignore'],
              env: { PATH: env.PATH, RUNNER_TEMP: directory,
                RUNNER_ENVIRONMENT: env.RUNNER_ENVIRONMENT, RUNNER_OS: env.RUNNER_OS, RUNNER_ARCH: env.RUNNER_ARCH } });
            let childFailed = false; child.once('error', () => { childFailed = true; });
            child.unref();
            const until = Math.min(now() + 5000, budget.deadlineMs);
            let last = 'watchdog-did-not-arm';
            while (!childFailed && now() < until) {
              try { validateWatchdog(env, budget, now());
                if (!isAbsolute(env.GITHUB_OUTPUT ?? '')) refuse('output-path-invalid');
                appendFileSync(env.GITHUB_OUTPUT, 'armed=true\n'); return budget;
              } catch (error) { if (error?.reason) last = error.reason; await delay(20); }
            }
            if (child.pid) { const p = readProcess(child.pid); if (p) signalIdentity(p, 'SIGTERM'); }
            // The last clause the checker saw is the best account of why the child never armed; none seen means it never wrote a receipt.
            refuse(last);
          }
          if (process.argv[1] && import.meta.url === pathToFileURL(resolve(process.argv[1])).href) {
            try {
              if (process.argv.length !== 3) refuse();
              if (process.argv[2] === 'bootstrap') await bootstrap();
              else if (process.argv[2] === 'watch') {
                const directory = temporary(process.env); const ticket = readJson(join(directory, 'service-watchdog-ticket.json'));
                exactKeys(ticket, ['budget', 'owner', 'baseline', 'uid']);
                const record = readJson(join(directory, 'service-budget.json'));
                exactKeys(record, Object.keys(ticket.budget));
                if (Object.keys(record).some(k => record[k] !== ticket.budget[k])) refuse();
                const table = readProcesses(); const owner = hostedOwner(process.env, table);
                if (processKey(owner) !== processKey(ticket.owner) || ticket.uid !== process.getuid()) refuse();
                process.exitCode = await watchJob({ ...ticket, baseline: new Map(ticket.baseline), directory });
              } else refuse();
            } catch (error) {
              // The closed list above is the only thing that may reach the log; refuse() drops any other reason.
              if (error?.reason) process.stderr.write(`Service deadline refused: ${error.reason}.\n`);
              process.stderr.write('Service deadline supervision failed.\n'); process.exitCode = 1;
            }
          }
