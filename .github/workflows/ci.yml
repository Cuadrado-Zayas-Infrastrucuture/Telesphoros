# Continuous integration. See docs/ops/ci-cd.md for what each job proves and how branch protection uses them.
#
# The five job names below ARE the required status checks in .github/rulesets/main.json.
# Renaming a job silently un-requires it, so change both together.
#
# Synthetic data only: nothing here has cloud credentials, and nothing is deployed.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every job only reads the repository. No job needs to write checks, comments or packages.
permissions:
  contents: read

# A newer push to the same pull request supersedes the older run. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  # Pinned to the same major the packages declare (engines.node >= 22).
  NODE_VERSION: "22"

jobs:
  # Fast gate: types, lint, the unit/API suites on the in-memory store, the production builds,
  # the knowledge-directory check, and the infrastructure tripwire.
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Frontend chunk budget
        run: pnpm --filter @telesphoros/frontend check:chunks
      # Fails if anything synthetic or unreviewed sits in the real knowledge directory.
      - name: Knowledge directory loads under production rules
        run: pnpm --filter @telesphoros/backend knowledge:verify --production
      - name: Terraform security tripwire
        run: pnpm test:infra
      - name: CI configuration tripwire (pinned actions, required checks match the ruleset)
        run: pnpm test:ci-config

  # The tiers a green in-memory run says nothing about: the schema, row-level security, backup/restore,
  # and the S3 protocol, on a real PostgreSQL 16 and an S3 emulator.
  database-and-storage:
    name: database-and-storage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway service container on the runner, reachable only from this job. Not a secret.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_S3_ENDPOINT: http://127.0.0.1:5555
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/ci/requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Backup/restore tests need the PostgreSQL 16 client tools and openssl
        run: |
          pg_dump --version | grep -E ' 16\.' || { echo "pg_dump 16 is required"; exit 1; }
          pg_restore --version | grep -E ' 16\.' || { echo "pg_restore 16 is required"; exit 1; }
          openssl version
      - name: Start the S3 emulator
        run: |
          pip install -r .github/ci/requirements.txt
          moto_server -H 127.0.0.1 -p 5555 > moto.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5555/moto-api/ > /dev/null && exit 0
            sleep 1
          done
          echo "the S3 emulator did not start"; cat moto.log; exit 1
      # Each run is checked for the notice that a tier was skipped. A tier that does not run proves nothing,
      # so a skip fails the job instead of passing quietly.
      - name: "Tier 1: unit + API suite (in-memory), plus the database and S3 specs"
        run: |
          pnpm --filter @telesphoros/backend test 2>&1 | tee tier1.log
          ! grep -F "[jest] NOT RUNNING" tier1.log
      - name: "Tier 2: the whole API suite on PostgreSQL"
        run: |
          TEST_STORAGE=postgres pnpm --filter @telesphoros/backend test 2>&1 | tee tier2.log
          ! grep -F "[jest] NOT RUNNING" tier2.log
      - name: "Tier 3: the whole API suite on PostgreSQL, uploading over the S3 protocol"
        run: |
          TEST_STORAGE=postgres TEST_OBJECT_STORAGE=s3 pnpm --filter @telesphoros/backend test 2>&1 | tee tier3.log
          ! grep -F "[jest] NOT RUNNING" tier3.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-and-storage-logs
          path: |
            tier*.log
            moto.log
          retention-days: 7

  # The login flow and the pages, for real: a fake identity provider (test only), the built API, the built
  # frontend, driven by a browser at 375 px and 1280 px.
  browser:
    name: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # System libraries are not part of the cache, so they are installed on every run.
      - name: Install the browser
        working-directory: apps/frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - name: Browser tests
        run: pnpm --filter @telesphoros/frontend e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failures
          path: apps/frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  # No cloud credentials and nothing is applied: formatting, then validation of the configuration itself.
  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      # -backend=false: there is no remote state yet, and CI must never touch any.
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # Advisory for now (not a required check): tflint's rules have not yet run on this code.
  # Promote it to a required check once it has been clean on main (docs/ops/ci-cd.md).
  terraform-lint:
    name: terraform-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          # Lets tflint download its AWS rule plugin without hitting the anonymous API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  # Every commit in the history, not just the diff: a secret removed in a later commit is still leaked.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # Built from source: the Go module checksum database verifies it. (The module still carries its
      # former path, github.com/zricethezav/gitleaks.) The maintainers' GitHub Action needs a paid licence
      # for organization repositories, so it is deliberately not used.
      - name: Install gitleaks v8.30.1
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan the full history
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --verbose --config .gitleaks.toml
