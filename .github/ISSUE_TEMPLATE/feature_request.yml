name: Feature request
description: Propose a change or an addition
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include patient data.** No names, identifiers, dates of birth, real reports, real genetic results or credentials. Use synthetic examples only. Report security problems through SECURITY.md, never here.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and who is affected.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like to happen. Smaller is better.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: clinical
    attributes:
      label: Does this change clinical logic or guideline handling?
      description: Clinical logic changes need tests and a validation note in docs/clinical-validation/ (see CONTRIBUTING.md).
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
