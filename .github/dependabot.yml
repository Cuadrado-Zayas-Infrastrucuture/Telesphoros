# Dependency updates. Grouping: minor and patch updates arrive together; major updates always get their own PR.
# GitHub Actions updates change the pinned commit SHA and the "# vX.Y.Z" comment beside it in one PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # NestJS packages move together: a lone @nestjs/* major (platform-express 12 on 11 siblings, ESM-only) fails typecheck.
    # Upgrade them in one deliberate migration PR; minor and patch updates still arrive.
    ignore:
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directory: /infrastructure/terraform
    schedule:
      interval: weekly
    groups:
      terraform-minor-patch:
        update-types: [minor, patch]

  # The S3 emulator the CI storage and browser tiers use: edit requirements.in; requirements.txt is generated from it with every package hashed.
  - package-ecosystem: pip
    directory: /.github/ci
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /infrastructure/docker
    schedule:
      interval: weekly

  # The API image's base layers (api.Dockerfile). The PostgreSQL service images in the workflows are pinned by digest too, but no
  # ecosystem watches workflow service containers: the weekly rescan (rescan.yml) reports that image's findings; bump its digest by hand.
  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule:
      interval: weekly
    # The Node runtime is pinned on purpose (Node 22; the toolchain and CI pin the same version). A new major, including a
    # non-LTS one such as 25, changes the whole toolchain: move it deliberately in its own PR.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
