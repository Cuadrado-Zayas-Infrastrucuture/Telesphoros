# gitleaks configuration (run by the secret-scan job in .github/workflows/ci.yml).
# Start from the maintained default rules; allow only what is named below, never a whole directory.
[extend]
useDefault = true

[[allowlists]]
description = "Deliberately unsigned alg=none JWT used as a test vector: the API must reject it (auth.e2e-spec.ts). Header {alg:none,typ:JWT}, payload {sub:user-a}, no signature."
condition = "AND"
paths = ['''apps/backend/test/auth\.e2e-spec\.ts''']
regexes = ['''eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0\.eyJzdWIiOiJ1c2VyLWEifQ\.''']

[[allowlists]]
description = "The disposable Moto Secrets Manager resource name synthetic/migrator is an identifier, not credential material; generated rehearsal passwords remain scanned."
condition = "AND"
ruleIDs = ["generic-api-key"]
paths = ['''^infrastructure/docker/rehearsal\.cjs$''']
regexTarget = "secret"
regexes = ['''^synthetic/migrator$''']

[[allowlists]]
description = "Migration names with the SHA-256 of their files in the pinned list of migration-history.spec.ts (the value the migrator stores in schema_migrations). A hash is not a credential; one row matches the generic-api-key rule because its name contains 'access'. Scoped by path, rule and the exact row shape, not by commit, so it survives a history rewrite."
condition = "AND"
ruleIDs = ["generic-api-key"]
paths = ['''^apps/backend/test/migration-history\.spec\.ts$''']
regexTarget = "line"
regexes = ['''^\s*\['\d{4}', '[a-z_0-9]+', '[0-9a-f]{64}'\],?\s*$''']
